events {}

http {
  absolute_redirect off;
  include /etc/nginx/mime.types;
  client_max_body_size 16m;
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

  server {
    listen 80;

    # ---- Security Headers (Start) ----
    # 1. Fix Clickjacking (Legacy fallback)
    # add_header X-Frame-Options "SAMEORIGIN" always;
    #
    # # 2. Fix CSP Fallback, Clickjacking (Modern), and Unsafe-Inline
    # # Note: 'unsafe-inline' has been removed from script-src and style-src
    # add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; form-action 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'self';" always;
    #
    # # 3. Fix the missing X-Content-Type-Options (from your Low findings)
    # add_header X-Content-Type-Options "nosniff" always;
    # # ---- Security Headers (End) ----

    # ---- auth subrequest ----
    location = /_auth {
      internal;
      proxy_pass http://auth:8000/verify;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Original-Method $request_method;
      proxy_set_header X-Original-URI $request_uri;
    }

    location @login { return 302 /auth/login?next=$uri; }

    # ---- auth (public) ----
    location = /auth/verify { return 404; }

    location = /auth/login {
      limit_req zone=login burst=10 nodelay;
      proxy_pass http://auth:8000/login;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }

    location = /auth/device-login {
      limit_req zone=login burst=5 nodelay;
      proxy_pass http://auth:8000/device-login;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /auth/ {
      proxy_pass http://auth:8000/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
    }

    # ---- static frontend ----
    location / {
      auth_request /_auth;
      error_page 401 = @login;
      root /usr/share/nginx/html;
      index index.html;
    }

    # ---- app1 ----
    location /app1/ {
      auth_request /_auth;
      auth_request_set $auth_user $upstream_http_x_user;

      proxy_pass http://app1:8000/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Actor $auth_user;
    }

    # ---- app2 ----
    location /app2/ {
      auth_request /_auth;
      auth_request_set $auth_user $upstream_http_x_user;
      error_page 401 = @login;

      proxy_pass http://app2:8000/;
      proxy_redirect / /app2/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Actor $auth_user;
    }

    # ---- app3 ----
    location /app3/ {
      auth_request /_auth;
      auth_request_set $auth_device $upstream_http_x_device;

      proxy_pass http://app3:8000/;
      proxy_redirect / /app3/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Device $auth_device;
    }
  }
}
