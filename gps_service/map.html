<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live GPS Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  </head>
  <body class="bg-gray-900 text-white h-screen flex flex-col font-sans">
    <!-- Top Control Bar -->
    <div
      class="bg-gray-800 p-4 shadow-lg flex flex-wrap gap-4 items-center justify-between z-10 relative"
    >
      <div class="flex items-center gap-4 flex-wrap">
        <h1 class="text-xl font-bold text-blue-400">Tracker Admin</h1>

        <input
          type="text"
          id="serverUrl"
          placeholder="Server URL (e.g., http://localhost/app3)"
          class="bg-gray-700 text-white px-4 py-2 rounded border border-gray-600 focus:outline-none focus:border-blue-400 w-72"
        />

        <input
          type="text"
          id="deviceId"
          placeholder="Device ID"
          class="bg-gray-700 text-white px-4 py-2 rounded border border-gray-600 focus:outline-none focus:border-blue-400"
        />

        <button
          id="trackBtn"
          onclick="toggleTracking()"
          class="bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded font-bold transition-colors"
        >
          Start Tracking
        </button>
      </div>

      <!-- Status Indicator -->
      <div class="flex items-center gap-2 bg-gray-700 px-4 py-2 rounded">
        <div id="statusDot" class="w-3 h-3 rounded-full bg-gray-400"></div>
        <span id="statusText" class="font-semibold text-gray-300"
          >Not Connected</span
        >
      </div>
    </div>

    <!-- The Map -->
    <div id="map" class="flex-grow z-0"></div>

    <script>
      // 1. Initialize Map
      const map = L.map("map").setView([8.4803, 124.6498], 13);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);

      let marker = null;
      let routeLine = null;
      let pollInterval = null;
      let isTracking = false;
      let lastLat = null;
      let lastLon = null;

      // UI Elements
      const trackBtn = document.getElementById("trackBtn");
      const serverInput = document.getElementById("serverUrl");
      const deviceInput = document.getElementById("deviceId");
      const statusDot = document.getElementById("statusDot");
      const statusText = document.getElementById("statusText");

      // Load saved URL from browser memory, or default to current host + /app3
      if (localStorage.getItem("serverUrl")) {
        serverInput.value = localStorage.getItem("serverUrl");
      } else {
        serverInput.value = window.location.origin + "/app3";
      }

      serverInput.addEventListener("input", (e) => {
        let url = e.target.value.trim();
        if (url.endsWith("/")) url = url.slice(0, -1);
        localStorage.setItem("serverUrl", url);
      });

      // Switch devices automatically when the ID is changed while tracking
      deviceInput.addEventListener("change", () => {
        if (isTracking) {
          toggleTracking(); // stop
          toggleTracking(); // start with the new ID
        }
      });

      function getBaseUrl() {
        let baseUrl = serverInput.value.trim();
        if (baseUrl.endsWith("/")) baseUrl = baseUrl.slice(0, -1);
        return baseUrl;
      }

      function toggleTracking() {
        if (isTracking) {
          clearInterval(pollInterval);
          isTracking = false;
          trackBtn.innerText = "Start Tracking";
          trackBtn.className =
            "bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded font-bold transition-colors";
          updateStatus("not_connected");
        } else {
          if (!serverInput.value.trim() || !deviceInput.value.trim()) {
            alert("Please enter both the Server URL and Device ID.");
            return;
          }

          isTracking = true;
          lastLat = null;
          lastLon = null;
          trackBtn.innerText = "Stop Tracking";
          trackBtn.className =
            "bg-red-600 hover:bg-red-500 px-6 py-2 rounded font-bold transition-colors";

          // Clear old line and marker if switching sessions/devices
          if (routeLine) {
            map.removeLayer(routeLine);
            routeLine = null;
          }
          if (marker) {
            map.removeLayer(marker);
            marker = null;
          }

          routeLine = L.polyline([], {
            color: "#3b82f6",
            weight: 4,
            opacity: 0.8,
          }).addTo(map);

          fetchRouteHistory();
          fetchLocation();
          pollInterval = setInterval(fetchLocation, 2000);
        }
      }

      async function fetchRouteHistory() {
        const baseUrl = getBaseUrl();
        const id = deviceInput.value.trim();

        try {
          const response = await fetch(`${baseUrl}/route/${id}`, {
            headers: { "ngrok-skip-browser-warning": "true" },
          });
          const data = await response.json();
          if (routeLine && Array.isArray(data.segments)) {
            routeLine.setLatLngs(data.segments);
          }
        } catch (err) {
          console.log("No route history found for today yet.");
        }
      }

      async function fetchLocation() {
        const baseUrl = getBaseUrl();
        const id = deviceInput.value.trim();

        try {
          const response = await fetch(`${baseUrl}/live/${id}`, {
            headers: { "ngrok-skip-browser-warning": "true" },
          });

          const data = await response.json();
          updateStatus(data.status);

          if (data.status === "online") {
            const { lat, lon } = data;
            const moved = lat !== lastLat || lon !== lastLon;

            if (!marker) {
              marker = L.marker([lat, lon]).addTo(map);
            } else if (moved) {
              marker.setLatLng([lat, lon]);
            }

            // Only redraw route and pan camera if the filtered position actually changed
            if (moved) {
              lastLat = lat;
              lastLon = lon;
              fetchRouteHistory();
              map.panTo([lat, lon], { animate: true, duration: 0.5 });
            }
          }
        } catch (error) {
          console.error("Error fetching location:", error);
          updateStatus("disconnected");
        }
      }

      function updateStatus(status) {
        if (status === "online") {
          statusDot.className =
            "w-3 h-3 rounded-full bg-green-500 animate-pulse";
          statusText.innerText = "Online & Tracking";
          statusText.className = "font-semibold text-green-400";
        } else if (status === "disconnected") {
          statusDot.className = "w-3 h-3 rounded-full bg-red-500";
          statusText.innerText = "Offline (Lost Signal)";
          statusText.className = "font-semibold text-red-400";
        } else {
          statusDot.className = "w-3 h-3 rounded-full bg-gray-400";
          statusText.innerText = "Not Connected";
          statusText.className = "font-semibold text-gray-300";
        }
      }
    </script>
  </body>
</html>
