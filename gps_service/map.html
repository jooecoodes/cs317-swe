<!doctype html>
<html>
  <head>
    <title>Supervisor Tracker</title>
    <!-- Load Leaflet CSS and JS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: sans-serif;
      }
      #map {
        height: 600px;
        width: 100%;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <h2>Live Supervisor Route</h2>
    <div id="map"></div>

    <script>
      var map = L.map("map").setView([0, 0], 2);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap contributors",
      }).addTo(map);

      // REMEMBER: Change this to your actual Traccar device ID
      fetch("http://localhost:8081/route/47985355")
        .then((response) => response.json())
        .then((data) => {
          if (data.path && data.path.length > 0) {
            var coordinates = data.path.map((point) => [point.lat, point.lon]);

            // 1. Draw the red line connecting the path
            var routeLine = L.polyline(coordinates, {
              color: "red",
              weight: 4,
            }).addTo(map);

            // 2. Draw a small blue dot for EVERY individual ping
            coordinates.forEach((coord) => {
              L.circleMarker(coord, {
                radius: 5,
                color: "white",
                weight: 1,
                fillColor: "#3388ff",
                fillOpacity: 1,
              }).addTo(map);
            });

            // 3. Drop a standard map pin on the LAST (most recent) known location
            var latestLocation = coordinates[coordinates.length - 1];
            L.marker(latestLocation)
              .addTo(map)
              .bindPopup("Current Location")
              .openPopup();

            // 4. Zoom the map correctly
            if (coordinates.length === 1) {
              // If there's only 1 point, zoom in on it directly
              map.setView(latestLocation, 17);
            } else {
              // If there's a path, frame the whole route
              map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });
            }
          } else {
            alert(
              "Database connected, but no path array was found for this ID.",
            );
          }
        })
        .catch((error) => {
          console.error("Error fetching data:", error);
          alert("Could not connect to the backend. Is Uvicorn running?");
        });
    </script>
  </body>
</html>
