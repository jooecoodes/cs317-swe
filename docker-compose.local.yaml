x-dev: &dev
  image: cs317-swe:local
  build:
    context: .
    target: dev
  volumes: !override
    - .:/app

services:
  auth:
    <<: *dev
    environment:
      - TZ=Asia/Manila
      - AUTH_COOKIE_SECURE=0
      - AUTH_DB_PATH=/app/data/auth/auth.db

  app1:
    <<: *dev
    environment: [TZ=Asia/Manila, APP1_DB_PATH=/app/data/app1/app.db]

  app2:
    <<: *dev
    environment: [TZ=Asia/Manila, PT_DB_PATH=/app/data/app2/photos.db, PT_UPLOAD_DIR=/app/data/app2/uploads]

  app3:
    <<: *dev
    environment: [TZ=Asia/Manila, GPS_DB_PATH=/app/data/app3/tracking.db]

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    ports: ["8081:80"]
