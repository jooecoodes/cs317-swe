<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Violation Tracker — API Showcase</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/script.js" defer></script>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <div class="logo">VT</div>
          <div>
            <h1>Violation Tracker</h1>
            <p>API Showcase</p>
          </div>
        </div>
        <div class="conn">
          <div class="field">
            <label>Base</label>
            <input
              id="baseUrl"
              spellcheck="false"
              placeholder="http://127.0.0.1:8000"
            />
            <span
              id="baseModified"
              class="base-mod"
              title="Overriding CONFIG.BASE_URL — click ↺ to reset"
              >●</span
            >
          </div>
          <div class="field token">
            <label>Token</label>
            <input
              id="adminToken"
              type="password"
              spellcheck="false"
              placeholder="X-Admin-Token"
            />
          </div>
          <button
            class="btn"
            id="resetConfig"
            title="Reset Base URL and Token to CONFIG defaults"
          >
            ↺
          </button>
          <button class="btn" id="pingBtn">
            <span class="dot" id="statusDot"></span> Ping
          </button>
        </div>
      </header>

      <div class="shell">
        <aside class="sidenav" id="sidenav">
          <div class="nav-label">Overview</div>
          <button class="nav-item active" data-nav="dashboard">
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <rect x="3" y="3" width="7" height="9" />
              <rect x="14" y="3" width="7" height="5" />
              <rect x="14" y="12" width="7" height="9" />
              <rect x="3" y="16" width="7" height="5" />
            </svg>
            Dashboard
          </button>
          <div class="nav-label">Data</div>
          <button class="nav-item" data-nav="employees">
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
            </svg>
            Employees
          </button>
          <button class="nav-item" data-nav="types">
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <path
                d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
              />
              <path d="M14 2v6h6" />
              <path d="M9 13h6M9 17h4" />
            </svg>
            Violation Types
          </button>
          <button class="nav-item" data-nav="violations">
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <path
                d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
              />
              <path d="M12 9v4M12 17h.01" />
            </svg>
            Violations
          </button>
          <div class="nav-label">Insight</div>
          <button class="nav-item" data-nav="analytics">
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <path d="M3 3v18h18" />
              <path d="m19 9-5 5-4-4-3 3" />
            </svg>
            Analytics
          </button>
          <button class="nav-item" data-nav="explorer">
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <path d="m16 18 6-6-6-6M8 6l-6 6 6 6" />
            </svg>
            API Explorer
          </button>
        </aside>

        <main id="view"></main>
      </div>
    </div>

    <div id="modalRoot"></div>
    <div id="toasts"></div>
  </body>
</html>
