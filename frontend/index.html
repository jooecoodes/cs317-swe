<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Violation Tracker — API Showcase</title>
    <style>
      :root {
        --bg: #0a0d13;
        --surface: #11151d;
        --surface-2: #171c26;
        --surface-3: #1e2532;
        --border: #232b3a;
        --border-2: #2e3849;
        --text: #e4e8f0;
        --muted: #8892a6;
        --faint: #5a6478;
        --accent: #6d8cff;
        --accent-2: #8b6dff;
        --ok: #34d399;
        --warn: #fbbf24;
        --danger: #f87171;
        --mono:
          "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas,
          monospace;
        --sans:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto,
          sans-serif;
        --r: 10px;
        --r-sm: 7px;
        --shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      body.nav-open main {
        overflow: hidden;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        background: none;
        border: none;
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #2a3344;
        border-radius: 6px;
        border: 2px solid var(--bg);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3a465c;
      }

      .app {
        display: grid;
        grid-template-rows: auto 1fr;
        height: 100vh;
        height: 100dvh;
      }
      .shell {
        display: grid;
        grid-template-columns: 230px 1fr;
        min-height: 0;
      }
      main {
        min-width: 0;
        overflow-y: auto;
        padding: 26px 30px 60px;
        -webkit-overflow-scrolling: touch;
      }

      .topbar {
        display: flex;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
        padding: 12px 22px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        position: relative;
        z-index: 20;
      }
      .hamburger {
        display: none;
        width: 34px;
        height: 34px;
        border-radius: 8px;
        flex: 0 0 auto;
        background: var(--surface-2);
        border: 1px solid var(--border-2);
        align-items: center;
        justify-content: center;
        color: var(--text);
        transition: 0.14s;
      }
      .hamburger:hover {
        background: var(--surface-3);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        min-width: 210px;
      }
      .logo {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        flex: 0 0 auto;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 13px;
        letter-spacing: -0.5px;
        color: #fff;
        box-shadow: 0 4px 14px rgba(109, 140, 255, 0.35);
      }
      .brand h1 {
        font-size: 14px;
        font-weight: 650;
        letter-spacing: -0.2px;
        line-height: 1.15;
      }
      .brand p {
        font-size: 11px;
        color: var(--faint);
        letter-spacing: 0.3px;
        text-transform: uppercase;
        font-weight: 600;
      }
      .conn {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
        flex-wrap: wrap;
      }
      .field {
        display: flex;
        align-items: center;
        gap: 7px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--r-sm);
        padding: 0 10px;
        height: 34px;
      }
      .field label {
        font-size: 11px;
        color: var(--faint);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        white-space: nowrap;
      }
      .field input {
        background: none;
        border: none;
        outline: none;
        font-size: 12.5px;
        font-family: var(--mono);
        width: 200px;
        color: var(--text);
      }
      .field input::placeholder {
        color: var(--faint);
      }
      .base-mod {
        color: var(--warn);
        font-size: 14px;
        display: none;
        line-height: 1;
        margin-left: -2px;
      }
      .base-mod.on {
        display: inline;
      }

      .actor-chip {
        background: var(--surface-2);
        border: 1px solid var(--border-2);
        color: var(--text);
        height: 34px;
        padding: 0 12px;
        gap: 7px;
        border-radius: var(--r-sm);
        display: inline-flex;
        align-items: center;
        font-size: 12.5px;
        font-weight: 550;
        transition: 0.14s;
        max-width: 220px;
        overflow: hidden;
      }
      .actor-chip:hover {
        background: var(--surface-3);
        border-color: #3d4a60;
      }
      .actor-chip svg {
        flex: 0 0 auto;
        opacity: 0.85;
      }
      .actor-chip .name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .actor-chip.unset {
        border-color: rgba(251, 191, 36, 0.4);
        color: #fbbf24;
      }
      .actor-chip.unset:hover {
        background: rgba(251, 191, 36, 0.1);
        border-color: rgba(251, 191, 36, 0.6);
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--faint);
        flex: 0 0 auto;
        transition: 0.25s;
      }
      .dot.ok {
        background: var(--ok);
        box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.15);
      }
      .dot.err {
        background: var(--danger);
        box-shadow: 0 0 0 3px rgba(248, 113, 113, 0.15);
      }
      .dot.busy {
        background: var(--warn);
        animation: pulse 1s infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 34px;
        padding: 0 13px;
        border-radius: var(--r-sm);
        background: var(--surface-2);
        border: 1px solid var(--border-2);
        font-size: 12.5px;
        font-weight: 550;
        color: var(--text);
        transition: 0.14s;
        white-space: nowrap;
      }
      .btn:hover {
        background: var(--surface-3);
        border-color: #3d4a60;
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        transform: none;
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .btn.primary:hover {
        background: #5c7cf5;
        border-color: #5c7cf5;
      }
      .btn.ghost {
        background: transparent;
        border-color: transparent;
        color: var(--muted);
      }
      .btn.ghost:hover {
        background: var(--surface-2);
        color: var(--text);
      }
      .btn.danger {
        color: var(--danger);
        border-color: rgba(248, 113, 113, 0.3);
      }
      .btn.danger:hover {
        background: rgba(248, 113, 113, 0.12);
        border-color: rgba(248, 113, 113, 0.5);
      }
      .btn.sm {
        height: 27px;
        padding: 0 9px;
        font-size: 11.5px;
        border-radius: 6px;
      }
      .btn.icon {
        width: 34px;
        padding: 0;
        justify-content: center;
      }

      .sidenav {
        background: var(--surface);
        border-right: 1px solid var(--border);
        padding: 16px 12px;
        overflow-y: auto;
      }
      .nav-label {
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.9px;
        text-transform: uppercase;
        color: var(--faint);
        padding: 14px 10px 6px;
      }
      .nav-label:first-child {
        padding-top: 2px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 8px 10px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        color: var(--muted);
        transition: 0.13s;
        text-align: left;
      }
      .nav-item:hover {
        background: var(--surface-2);
        color: var(--text);
      }
      .nav-item.active {
        background: rgba(109, 140, 255, 0.13);
        color: var(--accent);
      }
      .nav-item svg {
        flex: 0 0 auto;
        opacity: 0.85;
      }

      .nav-overlay {
        position: fixed;
        inset: 0;
        z-index: 80;
        background: rgba(5, 7, 11, 0.68);
        -webkit-backdrop-filter: blur(2px);
        backdrop-filter: blur(2px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.22s ease;
      }
      .nav-overlay.open {
        opacity: 1;
        pointer-events: auto;
      }

      .page-head {
        display: flex;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 22px;
        flex-wrap: wrap;
      }
      .page-head h2 {
        font-size: 21px;
        font-weight: 650;
        letter-spacing: -0.4px;
      }
      .page-head .sub {
        font-size: 13px;
        color: var(--muted);
        margin-top: 3px;
      }
      .page-head .actions {
        margin-left: auto;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r);
        overflow: hidden;
      }
      .card + .card {
        margin-top: 18px;
      }
      .card-head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 13px 16px;
        border-bottom: 1px solid var(--border);
      }
      .card-head h3 {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.1px;
      }
      .card-head .hint {
        font-size: 11.5px;
        color: var(--faint);
        font-family: var(--mono);
      }
      .card-head .right {
        margin-left: auto;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .card-body {
        padding: 16px;
      }
      .card-body.tight {
        padding: 0;
      }

      .stat-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 14px;
        margin-bottom: 18px;
      }
      .stat {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r);
        padding: 16px 18px;
        position: relative;
        overflow: hidden;
      }
      .stat::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 3px;
        background: linear-gradient(180deg, var(--accent), var(--accent-2));
        opacity: 0.85;
      }
      .stat .k {
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.7px;
        text-transform: uppercase;
        color: var(--faint);
      }
      .stat .v {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -1px;
        margin-top: 6px;
        font-variant-numeric: tabular-nums;
      }
      .stat .m {
        font-size: 11.5px;
        color: var(--muted);
        margin-top: 2px;
      }
      .stat.warn::before {
        background: linear-gradient(180deg, #fbbf24, #f59e0b);
      }
      .stat.danger::before {
        background: linear-gradient(180deg, #f87171, #ef4444);
      }
      .stat.ok::before {
        background: linear-gradient(180deg, #34d399, #10b981);
      }

      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .grid-3 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 18px;
      }
      @media (max-width: 1000px) {
        .grid-2 {
          grid-template-columns: 1fr;
        }
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      thead th {
        text-align: left;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.7px;
        text-transform: uppercase;
        color: var(--faint);
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        background: var(--surface-2);
        position: sticky;
        top: 0;
        z-index: 2;
      }
      tbody td {
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }
      tbody tr:last-child td {
        border-bottom: none;
      }
      tbody tr.clickable {
        cursor: pointer;
      }
      tbody tr.clickable:hover {
        background: var(--surface-2);
      }
      td.num,
      th.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
        font-family: var(--mono);
        font-size: 12.5px;
      }
      .mono {
        font-family: var(--mono);
        font-size: 12.5px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 2px 8px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.2px;
        white-space: nowrap;
      }
      .badge.ok {
        background: rgba(52, 211, 153, 0.13);
        color: #4ade80;
      }
      .badge.off {
        background: rgba(136, 146, 166, 0.13);
        color: var(--muted);
      }
      .badge.warn {
        background: rgba(251, 191, 36, 0.13);
        color: #fbbf24;
      }
      .badge.danger {
        background: rgba(248, 113, 113, 0.13);
        color: #f87171;
      }
      .badge.info {
        background: rgba(109, 140, 255, 0.13);
        color: #8ba4ff;
      }
      .badge.offense {
        background: rgba(139, 109, 255, 0.15);
        color: #a891ff;
      }
      .badge.audit {
        background: rgba(139, 109, 255, 0.15);
        color: #a891ff;
      }
      .badge.actor {
        background: rgba(251, 191, 36, 0.13);
        color: #fbbf24;
        font-family: var(--mono);
        font-size: 10.5px;
      }

      .method {
        display: inline-block;
        padding: 2px 7px;
        border-radius: 5px;
        font-family: var(--mono);
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.4px;
        flex: 0 0 auto;
      }
      .method.GET {
        background: rgba(109, 140, 255, 0.15);
        color: #8ba4ff;
      }
      .method.POST {
        background: rgba(52, 211, 153, 0.15);
        color: #4ade80;
      }
      .method.PATCH {
        background: rgba(251, 191, 36, 0.15);
        color: #fbbf24;
      }
      .method.PUT {
        background: rgba(139, 109, 255, 0.15);
        color: #a891ff;
      }
      .method.DELETE {
        background: rgba(248, 113, 113, 0.15);
        color: #f87171;
      }

      .filters {
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
        align-items: center;
      }
      input[type="text"],
      input[type="number"],
      input[type="password"],
      input[type="datetime-local"],
      input[type="date"],
      select,
      textarea {
        background: var(--surface-2);
        border: 1px solid var(--border-2);
        border-radius: var(--r-sm);
        padding: 0 11px;
        height: 34px;
        font-size: 13px;
        outline: none;
        transition: 0.14s;
        width: 100%;
        color-scheme: dark;
      }
      textarea {
        height: auto;
        padding: 9px 11px;
        font-family: var(--mono);
        font-size: 12.5px;
        resize: vertical;
        line-height: 1.55;
      }
      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(109, 140, 255, 0.14);
      }
      input::placeholder,
      textarea::placeholder {
        color: var(--faint);
      }
      .filters input {
        width: 150px;
        height: 32px;
      }
      .chk {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 12.5px;
        color: var(--muted);
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
      }
      .chk input {
        width: auto;
        height: auto;
        accent-color: var(--accent);
        cursor: pointer;
      }
      .form-row {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 14px;
      }
      .form-row label {
        font-size: 11.5px;
        font-weight: 600;
        color: var(--muted);
        letter-spacing: 0.2px;
      }
      .form-row label .opt {
        color: var(--faint);
        font-weight: 400;
      }
      .form-row label .req {
        color: var(--danger);
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 14px;
      }
      .form-grid .full {
        grid-column: 1/-1;
      }

      .pager {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        border-top: 1px solid var(--border);
        flex-wrap: wrap;
      }
      .pager .info {
        font-size: 12px;
        color: var(--muted);
        font-family: var(--mono);
      }
      .pager .spacer {
        margin-left: auto;
      }

      .chart-wrap {
        padding: 18px 16px 10px;
      }
      .chart {
        display: flex;
        align-items: flex-end;
        gap: 3px;
        height: 150px;
        position: relative;
      }
      .chart .bar {
        flex: 1;
        min-width: 2px;
        border-radius: 3px 3px 1px 1px;
        background: linear-gradient(180deg, #6d8cff, #3d5bd9);
        min-height: 2px;
        transition: 0.15s;
        position: relative;
        cursor: default;
      }
      .chart .bar.zero {
        background: #232b3a;
        min-height: 2px;
      }
      .chart .bar:hover {
        filter: brightness(1.35);
      }
      .chart .bar:hover::after {
        content: attr(data-tip);
        position: absolute;
        bottom: calc(100% + 7px);
        left: 50%;
        transform: translateX(-50%);
        background: #0a0d13;
        border: 1px solid var(--border-2);
        padding: 5px 9px;
        border-radius: 6px;
        font-size: 11px;
        font-family: var(--mono);
        white-space: nowrap;
        z-index: 10;
        color: var(--text);
        box-shadow: var(--shadow);
        pointer-events: none;
      }
      .xaxis {
        display: flex;
        justify-content: space-between;
        margin-top: 8px;
        font-size: 10.5px;
        color: var(--faint);
        font-family: var(--mono);
      }

      .feed-item {
        display: flex;
        gap: 13px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        align-items: flex-start;
      }
      .feed-item:last-child {
        border-bottom: none;
      }
      .feed-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        flex: 0 0 auto;
        background: linear-gradient(135deg, #2a3344, #1e2532);
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 700;
        color: var(--muted);
        border: 1px solid var(--border-2);
      }
      .feed-body {
        flex: 1;
        min-width: 0;
      }
      .feed-body .line1 {
        font-size: 13px;
        display: flex;
        gap: 7px;
        align-items: center;
        flex-wrap: wrap;
      }
      .feed-body .who {
        font-weight: 600;
      }
      .feed-body .line2 {
        font-size: 11.5px;
        color: var(--faint);
        margin-top: 3px;
        font-family: var(--mono);
      }
      .feed-meta {
        margin-left: auto;
        text-align: right;
        flex: 0 0 auto;
      }

      .json {
        font-family: var(--mono);
        font-size: 12.5px;
        line-height: 1.65;
        background: #0c1017;
        border: 1px solid var(--border);
        border-radius: var(--r-sm);
        padding: 14px 16px;
        overflow: auto;
        max-height: 460px;
        white-space: pre;
        tab-size: 2;
      }
      .j-key {
        color: #8ba4ff;
      }
      .j-str {
        color: #7ee2b8;
      }
      .j-num {
        color: #fbbf24;
      }
      .j-bool {
        color: #c792ea;
      }
      .j-null {
        color: #f87171;
      }

      .explorer {
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 20px;
        align-items: start;
      }
      @media (max-width: 1100px) {
        .explorer {
          grid-template-columns: 1fr;
        }
      }
      .ep-group {
        margin-bottom: 4px;
      }
      .ep-group-title {
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        color: var(--faint);
        padding: 12px 12px 5px;
      }
      .ep-item {
        display: flex;
        align-items: center;
        gap: 9px;
        width: 100%;
        text-align: left;
        padding: 7px 12px;

      #modalRoot {

        inset: 0;
        z-index: 100;

        display: block;
      }
      .modal-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(5, 7, 11, 0.75);
        -webkit-backdrop-filter: blur(4px);
        backdrop-filter: blur(4px);
        display: grid;
        place-items: center;
        padding: 24px;
        animation: fade 0.16s ease;
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
      }
      .modal {
        background: var(--surface);
        border: 1px solid var(--border-2);
        border-radius: 14px;
        width: 100%;
        max-width: 560px;
        max-height: 86vh;
        display: flex;
        flex-direction: column;
        box-shadow: var(--shadow);
        animation: pop 0.18s cubic-bezier(0.2, 0.9, 0.3, 1.2);
      }
      @keyframes pop {
        from {
          transform: scale(0.96) translateY(8px);
          opacity: 0;
        }
      }
      .modal.wide {
        max-width: 920px;
      }
      .modal-head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
        flex: 0 0 auto;
        flex-wrap: wrap;
      }
      .modal-head h3 {
        font-size: 15px;
        font-weight: 650;

      .modal-head .close {
        margin-left: auto;
        width: 32px;
        height: 32px;
        border-radius: 7px;
        display: grid;
        place-items: center;
        color: var(--muted);

      }
      .modal-head .close:hover {

      .modal-body {

      }
      .modal-foot {

        gap: 9px;

      #actorOverlay {
        position: fixed;
        inset: 0;
        z-index: 150;
        display: none;
      }
      #actorOverlay.open {
        display: block;
      }
      .actor-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(5, 7, 11, 0.82);
        -webkit-backdrop-filter: blur(6px);
        backdrop-filter: blur(6px);
        animation: fade 0.14s ease;
      }
      .actor-card {
        position: absolute;
        top: 50%;
        left: 50%;

      #toasts {

      .toast {

        border-left-color: var(--ok);

      .toast.err {
        border-left-color: var(--danger);
      }
      .toast.warn {
        border-left-color: var(--warn);
      }
      .toast .t {
        font-weight: 600;
        margin-bottom: 2px;
      }
      .toast .d {
        font-size: 12px;

      @keyframes slideIn {

        margin-bottom: 18px;
        line-height: 1.6;

        background: rgba(248, 113, 113, 0.07);

        color: #f5b8b8;
      }

      .cal-header {
        display: flex;

        gap: 10px;
        padding: 14px 16px;

    <script>
      /* ============================================================
   ⚙️  CONFIG — EDIT THIS BEFORE SHIPPING
   ============================================================ */
      const CONFIG = {
        BASE_URL: "http://127.0.0.1:8000",
      };

      const STORAGE_KEYS = {
        baseUrl: "vt.baseUrl",
        configBase: "vt.configBase",
        actor: "vt.actor",
      };
      if (localStorage.getItem(STORAGE_KEYS.configBase) !== CONFIG.BASE_URL) {
        localStorage.setItem(STORAGE_KEYS.configBase, CONFIG.BASE_URL);
        localStorage.removeItem(STORAGE_KEYS.baseUrl);
      }

      const state = {
        view: "dashboard",
        baseUrl: localStorage.getItem(STORAGE_KEYS.baseUrl) || CONFIG.BASE_URL,
        actor: sessionStorage.getItem(STORAGE_KEYS.actor) || "",
        connected: null,
        explorerEp: null,
        analyticsTab: "activity",
        activityTab: "timeline",
        calendarMonth: (() => {
          const d = new Date();
          return { year: d.getUTCFullYear(), month: d.getUTCMonth() };
        })(),
      };

      const view = document.getElementById("view");
      const modalRoot = document.getElementById("modalRoot");
      const statusDot = document.getElementById("statusDot");
      const baseUrlInput = document.getElementById("baseUrl");
      const actorChip = document.getElementById("actorChip");
      const actorNameEl = document.getElementById("actorName");

      /* ============================================================
   HELPERS
   ============================================================ */
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );

      function parseUTC(s) {
        if (!s) return null;
        let str = String(s);
        if (!/[Zz]$|[+-]\d{2}:?\d{2}$/.test(str)) str += "Z";
        const d = new Date(str);
        return isNaN(d) ? null : d;
      }
      function fmtDate(iso) {
        const d = parseUTC(iso);
        if (!d) return "—";
        return d.toLocaleString(undefined, {
          year: "numeric",
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      }
      function fmtDateShort(iso) {
        const d = parseUTC(iso);
        if (!d) return "—";
        return d.toLocaleDateString(undefined, {
          month: "short",
          day: "numeric",
        });
      }
      function fmtTimeOnly(iso) {
        const d = parseUTC(iso);
        if (!d) return "—";
        return d.toLocaleTimeString(undefined, {
          hour: "2-digit",
          minute: "2-digit",
        });
      }
      function relTime(iso) {
        const d = parseUTC(iso);
        if (!d) return "—";
        const diff = Date.now() - d.getTime();
        const m = Math.round(diff / 60000);
        if (m < 1) return "just now";
        if (m < 60) return m + "m ago";
        const h = Math.round(m / 60);
        if (h < 24) return h + "h ago";
        const days = Math.round(h / 24);
        if (days < 30) return days + "d ago";
        return fmtDateShort(iso);
      }
      function initials(name) {
        if (!name) return "?";
        return name
          .split(/\s+/)
          .slice(0, 2)
          .map((w) => w[0])
          .join("")
          .toUpperCase();
      }
      function toast(title, detail, kind = "") {
        const el = document.createElement("div");
        el.className = "toast " + kind;
        el.innerHTML = `<div class="t">${esc(title)}</div>${detail ? `<div class="d">${esc(detail)}</div>` : ""}`;
        document.getElementById("toasts").appendChild(el);
        setTimeout(() => {
          el.style.transition = "opacity .3s, transform .3s";
          el.style.opacity = "0";
          el.style.transform = "translateX(20px)";
          setTimeout(() => el.remove(), 320);
        }, 4200);
      }
      function highlightJSON(data) {
        const json = JSON.stringify(data, null, 2);
        if (json === undefined) return '<span class="faint">undefined</span>';
        return json.replace(
          /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
          (m) => {
            let cls = "j-num";
            if (/^"/.test(m)) cls = /:$/.test(m) ? "j-key" : "j-str";
            else if (/true|false/.test(m)) cls = "j-bool";
            else if (/null/.test(m)) cls = "j-null";
            return `<span class="${cls}">${esc(m)}</span>`;
          },
        );
      }
      function dayKey(d) {
        return d.toISOString().slice(0, 10);
      }
      function todayKey() {
        return dayKey(new Date());
      }

      /* ============================================================
   ACTOR
   ============================================================ */
      function updateActorChip() {
        if (state.actor) {
          actorChip.classList.remove("unset");
          actorNameEl.textContent = state.actor;
          actorChip.title = `Acting as "${state.actor}". Click to change.`;
        } else {
          actorChip.classList.add("unset");
          actorNameEl.textContent = "Set name";
          actorChip.title = "Set your name — required for writes (X-Actor).";
        }
      }
      function promptActor() {
        return new Promise((resolve) => {
          const overlay = document.getElementById("actorOverlay");
          const card = overlay.querySelector(".actor-card");
          card.innerHTML = `
      <h3>Who's making this change?</h3>
      <p class="desc">Your name is recorded on every create, update and delete — it appears in the activity log and on removal audit entries. Stored for this browser session only.</p>
      <div class="form-row" style="margin-top:16px">
        <label>Your name <span class="req">*</span> <span class="faint">(1–150 chars)</span></label>
        <input type="text" id="actorInput" maxlength="150" value="${esc(state.actor)}" placeholder="e.g. Juan Dela Cruz" autocomplete="off">
      </div>
      <div class="row-flex" style="gap:8px;justify-content:flex-end">
        <button class="btn" id="actorCancel">Cancel</button>
        <button class="btn primary" id="actorSave">Save</button>
      </div>
    `;
          overlay.classList.add("open");
          const input = card.querySelector("#actorInput");
          const finish = (name) => {
            overlay.classList.remove("open");
            card.innerHTML = "";
            resolve(name);
          };
          const save = () => {
            const name = input.value.trim();
            if (!name) {
              input.focus();
              return;
            }
            state.actor = name;
            sessionStorage.setItem(STORAGE_KEYS.actor, name);
            updateActorChip();
            finish(name);
          };
          const cancel = () => finish(null);
          card.querySelector("#actorSave").addEventListener("click", save);
          card.querySelector("#actorCancel").addEventListener("click", cancel);
          overlay.querySelector(".actor-backdrop").onclick = cancel;
          input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              save();
            }
            if (e.key === "Escape") {
              e.preventDefault();
              cancel();
            }
          });
          setTimeout(() => {
            input.focus();
            input.select();
          }, 40);
        });
      }
      actorChip.addEventListener("click", () => promptActor());
      updateActorChip();

      /* ============================================================
   HTTP LAYER
   ============================================================ */
      class ApiError extends Error {
        constructor(kind, message, result) {
          super(message);
          this.kind = kind;
          this.result = result;
        }
      }

      /* Every non-GET write on employees, violation-types, violations,
   subsections and penalties carries X-Actor — including the two
   removal endpoints (/remove and /violations/clear). */
      function pathNeedsActor(method, path) {
        if (method === "GET") return false;
        if (!/^\/(employees|violation-types|violations|subsections)/.test(path))
          return false;
        return true;
      }

      function buildQuery(query) {
        if (!query) return "";
        const usp = new URLSearchParams();
        for (const [k, v] of Object.entries(query)) {
          if (v === undefined || v === null || v === "") continue;
          usp.append(k, v);
        }
        const s = usp.toString();
        return s ? "?" + s : "";
      }

      async function req(method, path, { query, body } = {}) {
        if (pathNeedsActor(method, path) && !state.actor) {
          const name = await promptActor();
          if (!name)
            throw new ApiError("cancelled", "Cancelled — no actor set.", null);
        }
        const base = state.baseUrl.replace(/\/+$/, "");
        const url = base + path + buildQuery(query);
        const headers = {};
        if (body !== undefined && body !== null)
          headers["Content-Type"] = "application/json";
        if (pathNeedsActor(method, path)) headers["X-Actor"] = state.actor;
        const t0 = performance.now();
        let res;
        try {
          res = await fetch(url, {
            method,
            headers,
            body:
              body !== undefined && body !== null
                ? JSON.stringify(body)
                : undefined,
          });
        } catch (e) {
          throw new ApiError(
            "network",
            "Network error — API unreachable, or CORS is blocking the request.",
            null,
          );
        }
        const ms = Math.round(performance.now() - t0);
        const text = await res.text();
        let data = null;
        if (text) {
          try {
            data = JSON.parse(text);
          } catch {
            data = text;
          }
        }
        return { ok: res.ok, status: res.status, data, ms, url, method };
      }
      async function call(method, path, opts) {
        const r = await req(method, path, opts);
        if (!r.ok) throw new ApiError("http", `HTTP ${r.status}`, r);
        return r.data;
      }

      function describeError(result) {
        if (!result)
          return { title: "Request failed", detail: "", fields: [], code: "" };
        const d = result.data;
        if (!d || typeof d !== "object")
          return {
            title: `HTTP ${result.status}`,
            detail: typeof d === "string" ? d : "",
            fields: [],
            code: "",
          };
        if (Array.isArray(d.detail)) {
          return {
            title: "Validation failed (422)",
            detail: "",
            code: "",
            fields: d.detail.map((f) => ({
              loc: Array.isArray(f.loc) ? f.loc.join(".") : String(f.loc || ""),
              msg: f.msg || "",
            })),
          };
        }
        return {
          title: d.error || `HTTP ${result.status}`,
          detail: d.detail || "",
          fields: [],
          code: d.error || "",
        };
      }

      function errorBanner(err) {
        if (!err) return "";
        if (err.kind === "cancelled") return "";
        if (err.kind === "network") {
          return `<div class="callout err"><div class="ic">⚠</div><div><strong>Cannot reach the API.</strong> The server may be down, or CORS is blocking the browser.<br>Add this to <code>app/main.py</code> on the backend:
      <pre>from fastapi.middleware.cors import CORSMiddleware

app.add_middleware(
    CORSMiddleware,
    allow_origins=["*"],
    allow_credentials=True,
    allow_methods=["*"],
    allow_headers=["*"],
)</pre></div></div>`;
        }
        const d = describeError(err.result);
        let html = `<div class="callout err"><div class="ic">✕</div><div><strong>${esc(d.title)}</strong>`;
        if (d.detail) html += `<br>${esc(d.detail)}`;
        if (d.fields.length)
          html +=
            "<br>" +
            d.fields
              .map((f) => `<code>${esc(f.loc)}</code> — ${esc(f.msg)}`)
              .join("<br>");
        html += "</div></div>";
        return html;
      }
      const isCancelled = (e) => e && e.kind === "cancelled";
      const isErrorCode = (e, code) =>
        e && e.result && e.result.data && e.result.data.error === code;

      function setStatus(kind, title) {
        statusDot.className = "dot " + kind;
        statusDot.title = title || "";
      }
      async function ping() {
        setStatus("busy", "Checking…");
        try {
          const r = await req("GET", "/violation-types");
          if (r.ok) {
            state.connected = true;
            setStatus("ok", `Connected · ${r.ms}ms`);
            toast("Connected", `${state.baseUrl} · ${r.ms}ms`, "ok");
          } else {
            state.connected = false;
            setStatus("err", `HTTP ${r.status}`);
            toast("Reached server", `Unexpected status ${r.status}`, "warn");
          }
        } catch (e) {
          state.connected = false;
          setStatus("err", "Unreachable");
          toast("Connection failed", e.message, "err");
        }
        return state.connected;
      }

      /* ============================================================
   MODAL
   ============================================================ */
      function openModal(html, opts = {}) {
        modalRoot.innerHTML = `<div class="modal-backdrop"><div class="modal ${opts.wide ? "wide" : ""}">${html}</div></div>`;
        modalRoot.classList.add("open");
        const backdrop = modalRoot.querySelector(".modal-backdrop");
        backdrop.addEventListener("click", (e) => {
          if (e.target === backdrop) closeModal();
        });
        document.addEventListener("keydown", onEsc);
        backdrop
          .querySelectorAll("[data-close]")
          .forEach((b) => b.addEventListener("click", closeModal));
        if (opts.onMount) opts.onMount(backdrop.querySelector(".modal"));
      }
      function closeModal() {
        modalRoot.classList.remove("open");
        modalRoot.innerHTML = "";
        document.removeEventListener("keydown", onEsc);
      }
      function onEsc(e) {
        if (e.key === "Escape") closeModal();
      }

      function confirmModal({
        title,
        body,
        confirmLabel = "Confirm",
        danger = false,
        onConfirm,
      }) {

      function monthKey(d) {
        return d.toISOString().slice(0, 7);
      }
      function weekKey(date) {
        const d = new Date(
          Date.UTC(
            date.getUTCFullYear(),
            date.getUTCMonth(),
            date.getUTCDate(),
          ),
        );
        const dayNum = d.getUTCDay() || 7;
        d.setUTCDate(d.getUTCDate() + 4 - dayNum);
        const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
        const week = Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
        return `${d.getUTCFullYear()}-W${String(week).padStart(2, "0")}`;
      }
      function fillActivity(rows, days, bucket) {
        const map = new Map(rows.map((r) => [r.bucket, r]));
        const now = new Date();
        const start = new Date(now.getTime() - (days - 1) * 86400000);
        const keys = [];
        if (bucket === "day") {
          const d = new Date(
            Date.UTC(
              start.getUTCFullYear(),
              start.getUTCMonth(),
              start.getUTCDate(),
            ),
          );
          const end = new Date(
            Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()),
          );
          while (d <= end) {
            keys.push(dayKey(d));
            d.setUTCDate(d.getUTCDate() + 1);
          }
        } else if (bucket === "week") {
          const d = new Date(
            Date.UTC(
              start.getUTCFullYear(),
              start.getUTCMonth(),
              start.getUTCDate(),
            ),
          );
          const dow = (d.getUTCDay() + 6) % 7;
          d.setUTCDate(d.getUTCDate() - dow);
          while (d <= now) {
            keys.push(weekKey(d));
            d.setUTCDate(d.getUTCDate() + 7);
          }
        } else {
          const d = new Date(
            Date.UTC(start.getUTCFullYear(), start.getUTCMonth(), 1),
          );
          while (d <= now) {
            keys.push(monthKey(d));
            d.setUTCMonth(d.getUTCMonth() + 1);
          }
        }
        const seen = new Set();
        const out = [];
        for (const k of keys) {
          if (seen.has(k)) continue;
          seen.add(k);
          out.push(map.get(k) || { bucket: k, count: 0 });
        }
        return out;
      }
      function renderBarChart(rows) {
        if (!rows.length) return '<div class="empty">No data</div>';
        const max = Math.max(...rows.map((r) => r.count || 0), 1);
        const bars = rows
          .map((r) => {
            const pct =
              r.count === 0 ? 0 : Math.max(3, ((r.count || 0) / max) * 100);
            return `<div class="bar ${r.count === 0 ? "zero" : ""}" style="height:${pct}%" data-tip="${esc(r.bucket)} · ${r.count || 0} violation${r.count === 1 ? "" : "s"}"></div>`;
          })
          .join("");
        return `<div class="chart">${bars}</div><div class="xaxis"><span>${esc(rows[0].bucket)}</span><span>${esc(rows[rows.length - 1].bucket)}</span></div>`;
      }

      async function issueViolationModal(emp) {
        let types = [];
        try {
          types = await call("GET", "/violation-types");
        } catch (e) {
          toast(
            "Could not load violation types",
            describeError(e.result).title,
            "err",
          );
          return;
        }
        if (!types.length) {
          toast(
            "No violation types",
            "Create one first, or all types are deactivated.",
            "warn",
          );
          return;
        }

        let summary = [];
        try {
          summary = await call("GET", `/employees/${emp.id}/offense-summary`);
        } catch {
          summary = [];
        }
        const summaryBySub = new Map();
        (Array.isArray(summary) ? summary : []).forEach((r) => {
          if (r && typeof r.subsection_id === "number")
            summaryBySub.set(r.subsection_id, r);
        });

        openModal(
          `
    <div class="modal-head">
      <h3>Issue violation</h3>
      <div class="faint mono" style="font-size:11.5px">${esc(emp.full_name)} · ${esc(emp.employee_code)}</div>
      <button class="close" data-close>✕</button>
    </div>
    <div class="modal-body">
      <div id="ivErr"></div>

      <div class="form-row">
        <label>1. Violation type <span class="req">*</span></label>
        <select id="ivType">
          <option value="">— pick a type —</option>
          ${types.map((t) => `<option value="${t.id}">${esc(t.name)}</option>`).join("")}
        </select>
      </div>

      <div class="form-row">
        <label>2. Subsection <span class="req">*</span></label>
        <select id="ivSub" disabled>
          <option value="">— pick a type first —</option>
        </select>
      </div>

      <div id="ivPreview"></div>

      <div class="form-grid">
        <div class="form-row"><label>Issued by <span class="opt">optional</span></label><input type="text" id="ivBy" placeholder="Supervisor name"></div>
        <div class="form-row"><label>Issued at <span class="opt">optional</span></label><input type="datetime-local" id="ivAt"></div>
        <div class="form-row full"><label>Notes <span class="opt">optional</span></label><textarea id="ivNotes" rows="3" placeholder="Context…"></textarea></div>
      </div>

      <div class="callout info" style="margin:0">
        <div class="ic">ℹ</div>
        <div><code>offense_number</code> and <code>penalty_description</code> are computed server-side and snapshotted on the record. Historical records never change if you edit the tier later.</div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close>Cancel</button>
      <button class="btn primary" id="ivSend" disabled>Issue violation</button>
    </div>
  `,
          {
            onMount(m) {
              const typeSel = m.querySelector("#ivType");
              const subSel = m.querySelector("#ivSub");
              const preview = m.querySelector("#ivPreview");
              const sendBtn = m.querySelector("#ivSend");
              const errBox = m.querySelector("#ivErr");

              let currentSubId = null;

              typeSel.addEventListener("change", async () => {
                const typeId = typeSel.value;
                subSel.innerHTML = "";
                preview.innerHTML = "";
                sendBtn.disabled = true;
                currentSubId = null;
                if (!typeId) {
                  subSel.disabled = true;
                  subSel.innerHTML =
                    '<option value="">— pick a type first —</option>';
                  return;
                }
                subSel.disabled = true;
                subSel.innerHTML = '<option value="">Loading…</option>';
                try {
                  const subs = await call(
                    "GET",
                    `/violation-types/${typeId}/subsections`,
                  );
                  if (!subs.length) {
                    subSel.innerHTML =
                      '<option value="">— no active subsections —</option>';
                    errBox.innerHTML = `<div class="callout err"><div class="ic">✕</div><div>This violation type has no active subsections. Ask an admin to add one.</div></div>`;
                    return;
                  }
                  subSel.innerHTML =
                    `<option value="">— pick a subsection —</option>` +
                    subs
                      .map(
                        (s) =>
                          `<option value="${s.id}">${esc(s.name)}</option>`,
                      )
                      .join("");
                  subSel.disabled = false;
                } catch (e) {
                  subSel.innerHTML =
                    '<option value="">— failed to load —</option>';
                  errBox.innerHTML = errorBanner(e);
                }
              });

              subSel.addEventListener("change", async () => {
                const subId = subSel.value;
                errBox.innerHTML = "";
                preview.innerHTML = "";
                currentSubId = subId ? Number(subId) : null;
                if (!subId) {
                  sendBtn.disabled = true;
                  return;
                }

                preview.innerHTML = `<div class="preview-box"><div class="loading" style="padding:12px"><span class="spinner"></span>Loading penalty tier…</div></div>`;
                try {
                  const subDetail = await call("GET", `/subsections/${subId}`);
                  const penalties = subDetail.penalties || [];
                  const summaryRow = summaryBySub.get(Number(subId));
                  const nextNumber = summaryRow?.next_offense_number ?? 1;
                  const penalty = penalties.find(
                    (p) => p.offense_number === nextNumber,
                  );
                  const penaltyDesc =
                    penalty?.description ||
                    summaryRow?.penalty_if_repeated ||
                    null;

                  let previewHtml = `<div class="preview-box">
            <div class="preview-label">Preview</div>
            <div class="preview-offense">This will be offense #${nextNumber}</div>`;

                  if (penaltyDesc) {
                    previewHtml += `<div class="preview-penalty">${esc(penaltyDesc)}</div>`;
                  } else {
                    previewHtml += `<div class="preview-warn">⚠ No penalty tier defined for offense #${nextNumber}. Submission will fail with <code>400 NoPenaltyDefined</code>. Add a tier in Violation Types before issuing.</div>`;
                  }

                  if (
                    summaryRow &&
                    (summaryRow.active > 0 || summaryRow.removed > 0)
                  ) {
                    previewHtml += `<div class="faint" style="font-size:11.5px;margin-top:8px">
              Existing history: ${summaryRow.active} active · ${summaryRow.removed} removed
            </div>`;
                  }

                  previewHtml += `</div>`;
                  preview.innerHTML = previewHtml;
                  sendBtn.disabled = !penaltyDesc;
                } catch (e) {
                  preview.innerHTML = "";
                  errBox.innerHTML = errorBanner(e);
                }
              });

              sendBtn.addEventListener("click", async () => {
                errBox.innerHTML = "";
                if (!currentSubId) {
                  errBox.innerHTML = `<div class="callout err"><div class="ic">✕</div><div>Pick a violation type and subsection first.</div></div>`;
                  return;
                }
                const payload = { subsection_id: currentSubId };
                const by = m.querySelector("#ivBy").value.trim();
                const notes = m.querySelector("#ivNotes").value.trim();
                const at = m.querySelector("#ivAt").value;
                if (by) payload.issued_by = by;
                if (notes) payload.notes = notes;
                if (at) payload.issued_at = new Date(at).toISOString();

                const btn = sendBtn;
                btn.disabled = true;
                try {
                  const rec = await call(
                    "POST",
                    `/employees/${emp.id}/violations`,
                    { body: payload },
                  );
                  toast(
                    "Violation issued",
                    `${rec.violation_type_name || ""} · offense #${rec.offense_number ?? "—"}`,
                    "ok",
                  );
                  closeModal();
                  if (state.view === "violations") loadRecentFeed();
                  if (state.view === "employees") loadEmployees();
                } catch (e) {
                  if (isCancelled(e)) {
                    btn.disabled = false;
                    return;
                  }
                  if (isErrorCode(e, "NoPenaltyDefined")) {
                    const d = describeError(e.result);
                    errBox.innerHTML = `<div class="callout err"><div class="ic">✕</div><div><strong>No penalty defined.</strong><br>${esc(d.detail || "This subsection has no penalty tier for the next offense number. Ask an admin to add a tier in Violation Types, or pick a different subsection.")}</div></div>`;
                  } else {
                    errBox.innerHTML = errorBanner(e);
                  }
                  btn.disabled = false;
                }
              });
            },
          },
        );
      }

  `;
        document.getElementById("tApply").addEventListener("click", loadTypes);

          .addEventListener("change", loadTypes);

      async function loadTypes() {
        const el = document.getElementById("typeList");

        const includeInactive = document.getElementById("tInactive").checked
          ? "true"

            return;
          }

          el.innerHTML = `<table>
      <thead><tr><th>Name</th><th>Description</th><th>Status</th><th></th></tr></thead>
      <tbody>${types
        .map(
          (t) => `
        <tr>
          <td style="font-weight:550">${esc(t.name)}</td>
          <td class="faint trunc" title="${esc(t.description || "")}">${t.description ? esc(t.description) : "—"}</td>
          <td>${t.is_active ? '<span class="badge ok">active</span>' : '<span class="badge off">inactive</span>'}</td>
          <td style="text-align:right;white-space:nowrap">
            <button class="btn sm" data-manage="${t.id}">Manage</button>
            <button class="btn sm" data-edit="${t.id}">Edit</button>
            ${t.is_active ? `<button class="btn sm" data-deact="${t.id}">Deactivate</button>` : `<button class="btn sm" data-act="${t.id}">Activate</button>`}
            <button class="btn sm danger" data-del="${t.id}">Delete</button>
          </td>
        </tr>`,
        )
        .join("")}</tbody>
    </table>`;

          el.querySelectorAll("[data-manage]").forEach((b) =>
            b.addEventListener("click", () => {
              const t = types.find((x) => x.id === Number(b.dataset.manage));
              openManageType(t, loadTypes);
            }),
          );
          el.querySelectorAll("[data-edit]").forEach((b) =>
            b.addEventListener("click", () =>
              editTypeModal(
                types.find((x) => x.id === Number(b.dataset.edit)),
                loadTypes,
              ),
            ),
          );
          el.querySelectorAll("[data-act]").forEach((b) =>
            b.addEventListener("click", () =>
              typeAction(
                `/violation-types/${b.dataset.act}/activate`,
                "Type activated",
              ),
            ),
          );
          el.querySelectorAll("[data-deact]").forEach((b) =>
            b.addEventListener("click", () =>
              typeAction(
                `/violation-types/${b.dataset.deact}/deactivate`,
                "Type deactivated",
              ),
            ),
          );
          el.querySelectorAll("[data-del]").forEach((b) =>
            b.addEventListener("click", () =>
              deleteTypeFlow(types.find((x) => x.id === Number(b.dataset.del))),
            ),
          );
        } catch (e) {
          el.innerHTML = errorBanner(e);
        }
      }

      async function typeAction(path, okMsg) {
        try {
          await call("POST", path);
          toast(okMsg, "", "ok");
          loadTypes();
        } catch (e) {
          if (isCancelled(e)) return;
          const d = describeError(e.result);
          toast(
            "Action failed",
            d.title + (d.detail ? " — " + d.detail : ""),
            "err",
          );
        }
      }

      function deleteTypeFlow(t) {
        confirmModal({
          title: "Delete violation type?",
          danger: true,
          confirmLabel: "Delete",
          body: `<p style="font-size:13px;color:var(--muted)">Deleting <strong>${esc(t.name)}</strong> only works if no violation record references it. Otherwise you get <code>409</code>.</p>`,
          onConfirm: async () => {
            try {
              await call("DELETE", `/violation-types/${t.id}`);
              toast("Type deleted", t.name, "ok");
              closeModal();
              loadTypes();
            } catch (e) {
              if (isCancelled(e)) return;
              const d = describeError(e.result);
              if (e.result && e.result.status === 409) {
                closeModal();
                confirmModal({
                  title: "Type is in use",
                  confirmLabel: "Deactivate instead",
                  body: `<p style="font-size:13px;color:var(--muted)">${esc(d.detail || "This violation type is referenced by existing records and cannot be deleted.")}</p>
                   <p style="font-size:13px;color:var(--muted);margin-top:10px">Deactivating hides it from the issue dropdown while preserving history.</p>`,
                  onConfirm: async () => {
                    try {
                      await call("POST", `/violation-types/${t.id}/deactivate`);
                      toast("Type deactivated", t.name, "ok");
                      closeModal();
                      loadTypes();
                    } catch (e2) {
                      if (isCancelled(e2)) return;
                      toast("Failed", describeError(e2.result).title, "err");
                    }
                  },
                });
              } else {
                toast("Delete failed", d.title, "err");
              }
            }
          },
        });

        typeFormModal(null, null);
      }
      function editTypeModal(t, after) {
        typeFormModal(t, after);
      }

      function typeFormModal(existing, after) {
        const isEdit = !!existing;
        openModal(
          `
    <div class="modal-head"><h3>${isEdit ? "Edit Violation Type" : "New Violation Type"}</h3><button class="close" data-close>✕</button></div>
    <div class="modal-body">
      <div id="tpErr"></div>
      <div class="form-row"><label>Name</label><input type="text" id="tpName" value="${existing ? esc(existing.name) : ""}" placeholder="e.g. Attendance"></div>
      <div class="form-row"><label>Description <span class="opt">optional</span></label><textarea id="tpDesc" rows="2">${existing && existing.description ? esc(existing.description) : ""}</textarea></div>
    </div>
    <div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="tpSave">${isEdit ? "Save changes" : "Create type"}</button></div>
  `,
          {
            onMount(m) {
              m.querySelector("#tpSave").addEventListener("click", async () => {
                const errBox = m.querySelector("#tpErr");
                errBox.innerHTML = "";
                const name = m.querySelector("#tpName").value.trim();
                const desc = m.querySelector("#tpDesc").value.trim();
                if (!name) {
                  errBox.innerHTML = `<div class="callout err"><div class="ic">✕</div><div>Name is required.</div></div>`;
                  return;
                }
                try {
                  if (isEdit) {
                    const payload = {};
                    if (name !== existing.name) payload.name = name;
                    if (desc && desc !== (existing.description || ""))
                      payload.description = desc;
                    if (!Object.keys(payload).length) {
                      toast("Nothing to update", "", "warn");
                      return;
                    }
                    await call("PATCH", `/violation-types/${existing.id}`, {
                      body: payload,
                    });
                    toast("Type updated", name, "ok");
                  } else {
                    const payload = { name };
                    if (desc) payload.description = desc;
                    await call("POST", "/violation-types", { body: payload });
                    toast("Type created", name, "ok");
                  }
                  closeModal();
                  if (after) after();
                  else loadTypes();
                } catch (e) {
                  if (isCancelled(e)) return;
                  errBox.innerHTML = errorBanner(e);
                }
              });
            },
          },
        );
      }

      async function openManageType(type, after) {
        let subs = [];
        try {
          subs = await call("GET", `/violation-types/${type.id}/subsections`, {
            query: { include_inactive: "true" },
          });
        } catch (e) {
          toast(
            "Could not load subsections",
            describeError(e.result).title,
            "err",
          );
          return;
        }
        const details = await Promise.all(
          subs.map((s) =>
            call("GET", `/subsections/${s.id}`).catch(() => ({
              ...s,
              penalties: [],
            })),
          ),
        );

        openModal(
          `
    <div class="modal-head">
      <h3>${esc(type.name)}</h3>
      <span class="badge ${type.is_active ? "ok" : "off"}">${type.is_active ? "active" : "inactive"}</span>
      <button class="close" data-close>✕</button>
    </div>
    <div class="modal-body">
      <div class="row-flex" style="margin-bottom:14px">
        <button class="btn primary sm" id="addSubBtn">+ Add subsection</button>
        <span class="right faint mono" style="font-size:11px">${details.length} subsection${details.length === 1 ? "" : "s"}</span>
      </div>
      <div id="subsList"></div>
    </div>
    <div class="modal-foot"><button class="btn" data-close>Close</button></div>
  `,
          {
            wide: true,
            onMount(m) {
              const subsList = m.querySelector("#subsList");

              const renderSubs = () => {
                if (!details.length) {
                  subsList.innerHTML =
                    '<div class="empty" style="padding:24px">No subsections yet. Add one to start defining penalties.</div>';
                  return;
                }
                subsList.innerHTML = details
                  .map((s) => {
                    const penalties = (s.penalties || [])
                      .slice()
                      .sort((a, b) => a.offense_number - b.offense_number);
                    return `<div class="sub-card">
            <div class="sub-card-head">
              <div style="min-width:0">
                <div class="sub-card-title">${esc(s.name)} ${s.is_active ? '<span class="badge ok" style="margin-left:6px">active</span>' : '<span class="badge off" style="margin-left:6px">inactive</span>'}</div>
                ${s.description ? `<div class="sub-card-desc">${esc(s.description)}</div>` : ""}
              </div>
              <div class="sub-card-actions">
                <button class="btn sm" data-edit-pen="${s.id}">Penalties (${penalties.length})</button>
                <button class="btn sm" data-edit-sub="${s.id}">Edit</button>
                ${s.is_active ? `<button class="btn sm" data-deact-sub="${s.id}">Deactivate</button>` : `<button class="btn sm" data-act-sub="${s.id}">Activate</button>`}
                <button class="btn sm danger" data-del-sub="${s.id}">Delete</button>
              </div>
            </div>
            ${
              penalties.length
                ? `<div class="penalty-list">
              ${penalties.map((p) => `<div class="penalty-row"><div class="penalty-num">#${p.offense_number}</div><div class="penalty-desc">${esc(p.description)}</div></div>`).join("")}
            </div>`
                : `<div class="faint" style="font-size:12px;padding:6px 0">No penalties defined yet — issuing will fail with 400.</div>`
            }
          </div>`;
                  })
                  .join("");

                subsList.querySelectorAll("[data-edit-pen]").forEach((b) =>
                  b.addEventListener("click", () => {
                    const s = details.find(
                      (x) => x.id === Number(b.dataset.editPen),
                    );
                    editPenaltiesModal(s, () => {
                      closeModal();
                      openManageType(type, after);
                    });
                  }),
                );
                subsList.querySelectorAll("[data-edit-sub]").forEach((b) =>
                  b.addEventListener("click", () => {
                    const s = details.find(
                      (x) => x.id === Number(b.dataset.editSub),
                    );
                    editSubsectionModal(s, () => {
                      closeModal();
                      openManageType(type, after);
                    });
                  }),
                );
                subsList.querySelectorAll("[data-act-sub]").forEach((b) =>
                  b.addEventListener("click", async () => {
                    try {
                      await call(
                        "POST",
                        `/subsections/${b.dataset.actSub}/activate`,
                      );
                      toast("Subsection activated", "", "ok");
                      closeModal();
                      openManageType(type, after);
                    } catch (e) {
                      if (isCancelled(e)) return;
                      toast("Failed", describeError(e.result).title, "err");
                    }
                  }),
                );
                subsList.querySelectorAll("[data-deact-sub]").forEach((b) =>
                  b.addEventListener("click", async () => {
                    try {
                      await call(
                        "POST",
                        `/subsections/${b.dataset.deactSub}/deactivate`,
                      );
                      toast("Subsection deactivated", "", "ok");
                      closeModal();
                      openManageType(type, after);
                    } catch (e) {
                      if (isCancelled(e)) return;
                      toast("Failed", describeError(e.result).title, "err");
                    }
                  }),
                );
                subsList.querySelectorAll("[data-del-sub]").forEach((b) =>
                  b.addEventListener("click", () => {
                    const s = details.find(
                      (x) => x.id === Number(b.dataset.delSub),
                    );
                    if (!s) return;
                    confirmModal({
                      title: `Delete subsection "${s.name}"?`,
                      danger: true,
                      confirmLabel: "Delete",
                      body: `<p style="font-size:13px;color:var(--muted)">Only works if no violation record references it. Otherwise you get <code>409</code>.</p>`,
                      onConfirm: async () => {
                        try {
                          await call("DELETE", `/subsections/${s.id}`);
                          toast("Subsection deleted", s.name, "ok");
                          closeModal();
                          openManageType(type, after);
                        } catch (e) {
                          if (isCancelled(e)) return;
                          toast(
                            "Delete failed",
                            describeError(e.result).title,
                            "err",
                          );
                        }
                      },
                    });
                  }),
                );
              };

              renderSubs();
              m.querySelector("#addSubBtn").addEventListener("click", () => {
                addSubsectionModal(type, () => {
                  closeModal();
                  openManageType(type, after);
                });
              });
            },
          },
        );
      }

    <div class="modal-body">
      <div id="esErr"></div>

      function editPenaltiesModal(sub, after) {
        const existing = (sub.penalties || [])
          .slice()
          .sort((a, b) => a.offense_number - b.offense_number);
        const rows = existing.map((p) => ({ description: p.description }));

        openModal(
          `
    <div class="modal-head"><h3>Penalty tiers · ${esc(sub.name)}</h3><button class="close" data-close>✕</button></div>
    <div class="modal-body">
      <div id="pnErr"></div>
      <div class="callout info" style="margin-bottom:14px"><div class="ic">ℹ</div><div>Tiers are numbered <strong>1, 2, 3…</strong> in order. On save, the whole list is replaced (PUT). If the next offense for an employee has no tier here, issuing will fail with <code>400 NoPenaltyDefined</code>.</div></div>
      <div id="penRows"></div>
      <button class="btn sm" id="addPenBtn">+ Add tier</button>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close>Cancel</button>
      <button class="btn primary" id="pnSave">Save tiers</button>
    </div>
  `,
          {
            wide: true,
            onMount(m) {
              const container = m.querySelector("#penRows");
              const renderRows = () => {
                container.innerHTML =
                  rows
                    .map(
                      (r, i) => `
          <div class="pen-row">
            <div class="n">#${i + 1}</div>
            <input type="text" data-pen="${i}" value="${esc(r.description)}" placeholder="e.g. Written warning">
            <button class="btn sm danger rm" data-rm="${i}" title="Remove">✕</button>
          </div>`,
                    )
                    .join("") ||
                  '<div class="faint" style="font-size:12px;padding:8px">No tiers defined yet.</div>';

                container.querySelectorAll("[data-pen]").forEach((inp) =>
                  inp.addEventListener("input", () => {
                    const i = Number(inp.dataset.pen);
                    rows[i].description = inp.value;
                  }),
                );
                container.querySelectorAll("[data-rm]").forEach((b) =>
                  b.addEventListener("click", () => {
                    rows.splice(Number(b.dataset.rm), 1);
                    renderRows();
                  }),
                );
              };
              renderRows();

              m.querySelector("#addPenBtn").addEventListener("click", () => {
                rows.push({ description: "" });
                renderRows();
              });

              m.querySelector("#pnSave").addEventListener("click", async () => {
                const errBox = m.querySelector("#pnErr");
                errBox.innerHTML = "";
                const cleaned = rows
                  .map((r) => ({ description: (r.description || "").trim() }))
                  .filter((r) => r.description);
                if (!cleaned.length) {
                  errBox.innerHTML = `<div class="callout err"><div class="ic">✕</div><div>At least one penalty tier with a description is required.</div></div>`;
                  return;
                }
                const payload = {
                  penalties: cleaned.map((r, i) => ({
                    offense_number: i + 1,
                    description: r.description,
                  })),
                };
                const btn = m.querySelector("#pnSave");
                btn.disabled = true;
                try {
                  await call("PUT", `/subsections/${sub.id}/penalties`, {
                    body: payload,
                  });
                  toast(
                    "Penalty tiers saved",
                    `${payload.penalties.length} tier${payload.penalties.length === 1 ? "" : "s"}`,
                    "ok",
                  );
                  closeModal();
                  if (after) after();
                } catch (e) {
                  if (isCancelled(e)) {
                    btn.disabled = false;
                    return;
                  }
                  errBox.innerHTML = errorBanner(e);
                  btn.disabled = false;
                }
              });
            },
          },
        );
      }

      async function renderViolations() {
        view.innerHTML = `

      async function loadRecentFeed() {
        const el = document.getElementById("feedList");
        el.innerHTML = `<div class="loading"><span class="spinner"></span>Loading…</div>`;
        const days = document.getElementById("feedDays").value;
        const limit = Math.min(
          200,
          Math.max(1, Number(document.getElementById("feedLimit").value) || 50),
        );
        try {
          const items = await call("GET", "/violations/recent", {
            query: { days, limit },
          });
          if (!items.length) {
            el.innerHTML = `<div class="empty"><div class="big">◌</div>No violations in the last ${days} days.</div>`;
            return;
          }
          el.innerHTML = items
            .map(
              (f) => `
      <div class="feed-item">
        <div class="feed-avatar">${esc(initials(f.employee ? f.employee.full_name : "?"))}</div>
        <div class="feed-body">
          <div class="line1">
            <span class="who">${f.employee ? esc(f.employee.full_name) : "Unknown employee"}</span>
            ${f.employee ? `<span class="faint mono" style="font-size:11px">${esc(f.employee.employee_code)}</span>` : ""}
            <span class="badge offense">offense #${f.offense_number ?? "—"}</span>
          </div>
          <div class="line2">
            ${esc(f.violation_type_name || "—")}${f.subsection_name ? " · " + esc(f.subsection_name) : ""}
            ${f.penalty_description ? '<br><span style="color:var(--muted)">' + esc(f.penalty_description) + "</span>" : ""}
            ${f.issued_by ? "<br>by " + esc(f.issued_by) : ""}
          </div>
        </div>
        <div class="feed-meta">
          <div style="font-size:11.5px" class="muted">${esc(fmtDateShort(f.issued_at))}</div>
          <div class="faint" style="font-size:11px">${esc(relTime(f.issued_at))}</div>
          <button class="btn sm danger" data-remove="${f.id}" style="margin-top:6px">Remove</button>
        </div>
      </div>`,
            )
            .join("");
          el.querySelectorAll("[data-remove]").forEach((b) =>
            b.addEventListener("click", () => {
              const f = items.find((x) => x.id === Number(b.dataset.remove));
              if (f) removalFormModal(f, { onDone: () => loadRecentFeed() });
            }),
          );
        } catch (e) {
          el.innerHTML = errorBanner(e);
        }
      }

      function issueByLookupModal() {
        openModal(
          `
    <div class="modal-head"><h3>Issue a violation</h3><button class="close" data-close>✕</button></div>
    <div class="modal-body">
      <div id="lkErr"></div>
      <div class="form-row">
        <label>Employee code or search</label>

    </div>
    <div class="modal-foot"><button class="btn" data-close>Cancel</button></div>
  `,
          {
            onMount(m) {
              const doFind = async () => {
                const q = m.querySelector("#lkCode").value.trim();
                const box = m.querySelector("#lkResults");
                const errBox = m.querySelector("#lkErr");
                errBox.innerHTML = "";
                if (!q) return;
                box.innerHTML = `<div class="loading"><span class="spinner"></span>Searching…</div>`;
                try {
                  let results;
                  try {
                    results = [
                      await call(
                        "GET",
                        `/employees/by-code/${encodeURIComponent(q)}`,
                      ),
                    ];
                  } catch {
                    const page = await call("GET", "/employees", {
                      query: { search: q, limit: 10 },
                    });
                    results = page.items;
                  }
                  if (!results.length) {
                    box.innerHTML = `<div class="empty" style="padding:20px">No match.</div>`;
                    return;
                  }
                  box.innerHTML = results
                    .map(
                      (e) => `
            <button class="ep-item" data-pick="${e.id}" style="width:100%;padding:10px 12px;border:1px solid var(--border);margin-bottom:6px;border-radius:8px">
              <div class="feed-avatar" style="width:26px;height:26px;font-size:10px">${esc(initials(e.full_name))}</div>
              <div style="text-align:left;min-width:0">
                <div style="font-weight:550;font-size:13px">${esc(e.full_name)}</div>
                <div class="faint mono" style="font-size:11px">${esc(e.employee_code)}</div>
              </div>
            </button>`,
                    )
                    .join("");
                  box.querySelectorAll("[data-pick]").forEach((b) =>
                    b.addEventListener("click", async () => {
                      try {
                        const full = await call(
                          "GET",
                          `/employees/${b.dataset.pick}`,
                        );
                        closeModal();
                        issueViolationModal(full);
                      } catch (e) {
                        errBox.innerHTML = errorBanner(e);
                      }
                    }),
                  );
                } catch (e) {
                  box.innerHTML = "";
                  errBox.innerHTML = errorBanner(e);
                }
              };
              m.querySelector("#lkFind").addEventListener("click", doFind);
              m.querySelector("#lkCode").addEventListener("keydown", (e) => {
                if (e.key === "Enter") doFind();
              });
            },
          },
        );
      }

        const at = record.issued_at;

        <div><strong>Removal is permanent and audited.</strong> Your actor name (<code>${esc(state.actor || "not set")}</code>) will be recorded as <code>removed_by</code> on the audit entry.</div>
      </div>
