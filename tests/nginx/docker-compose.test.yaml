name: cs317-tier2

services:
  nginx:
    image: nginx:alpine
    ports:
      - "8091:80"
    volumes:
      - ../../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [auth, app1, app2, app3]

  auth:
    build: ./stub
    environment: { ROLE: auth }

  app1:
    build: ./stub
    environment: { ROLE: app }

  app2:
    build: ./stub
    environment: { ROLE: app }

  app3:
    build: ./stub
    environment: { ROLE: app }
